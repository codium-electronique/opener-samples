CONFIG_KERNEL_BIN_NAME="sample-dectnrp-spinel"

#Enable thread awareness for debugging tools supporting it
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_ASSERT=y

CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

CONFIG_NETWORKING=y

# The nRF91 driver sends the first fragment of a TX packet only, so one
# buffer must hold a whole frame: type 2 physical header (10) + MTU (1024).
# One TX packet per Spinel op slot; received frames do not use net_pkt.
CONFIG_NET_BUF_DATA_SIZE=1034
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=2
CONFIG_NET_PKT_RX_COUNT=2

# Kernel options
CONFIG_HEAP_MEM_POOL_SIZE=2048

# The console and log backends are in the board files: RTT where Spinel
# takes the console UART.
CONFIG_LOG=y

CONFIG_DECTNRP_DRIVER_NRF91X1=y
CONFIG_DECTNRP_DRIVER_NRF91X1_CAP_LOGGING=n
CONFIG_DECTNRP_DRIVER_SCHEDULED_API=y
CONFIG_DECTNRP_DRIVER_BLOCKING_API=n

# The devicetree picks the transport: SPI with an opener,spinel-spi node,
# else the UART chosen as opener,spinel-uart.
CONFIG_DECTNRP_SPINEL=y
