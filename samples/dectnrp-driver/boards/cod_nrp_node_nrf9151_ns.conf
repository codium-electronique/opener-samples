# The node reads its sensors and sends them as the sensor record. The LIS2MDL sits on the
# LSM6DSL sensor hub.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL_SENSORHUB=y
CONFIG_LSM6DSL_EXT0_LIS2MDL=y
CONFIG_DECTNRP_SAMPLE_SENSOR_PAYLOAD=y
