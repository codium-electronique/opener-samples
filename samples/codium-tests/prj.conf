CONFIG_TFM_PROFILE_TYPE_MINIMAL=y

CONFIG_HWINFO=y
CONFIG_LOG=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MAX_LEVEL=4

# Enable printk
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_SHELL=y

CONFIG_TFM_SECURE_UART0=y
CONFIG_TFM_SECURE_UART1=n
CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=y
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y
CONFIG_TFM_LOG_LEVEL_SILENCE=n

# Ensure an MCUboot-compatible binary is generated.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y

CONFIG_DEBUG_OPTIMIZATIONS=y
#Enable thread awareness for debugging tools supporting it
CONFIG_DEBUG_THREAD_INFO=y
