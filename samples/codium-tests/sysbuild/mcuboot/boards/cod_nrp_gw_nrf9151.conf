# MCUboot config to enable secondary slot on the external flash

# Multithreading needed for NRFX SPI drivers, needed for SPI NOR flash
CONFIG_MULTITHREADING=y

CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=32

CONFIG_PM_OVERRIDE_EXTERNAL_DRIVER_CHECK=y

# MCUboot requires a large stack size, otherwise an MPU fault will occur
CONFIG_MAIN_STACK_SIZE=16384

# Enable flash operations
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# BOOT_MAX_IMG_SECTORS_AUTO can't compute the secondary slot's sector count:
# slot1_partition lives on mx25r1635f (jedec,spi-nor), which doesn't expose
# erase-block-size/write-block-size in devicetree (real SPI NOR chips report
# this via SFDP at runtime, not via DT). Set it explicitly instead:
# slot0/slot1 are both 768 KB and the MX25R1635F erases in 4 KB sectors.
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=192
