CONFIG_PM=n

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_ENCRYPT_IMAGE=n

# FIXME: in production builds, only authorize upgrade but no downgrade
# FIXME: see other related options to prevent downgrade in docs
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_BOOT_BOOTSTRAP=n

CONFIG_FW_INFO=y
# NSIB monotonic counter. Must be incremented with every MCUBoot release to
# prevent NSIB from accepting a rollback to an older MCUBoot image.
# Keep in sync with SB_CONFIG_SECURE_BOOT_MCUBOOT_VERSION in sysbuild*.conf.
# Current value must always be >= the value burned into deployed hardware.
CONFIG_FW_INFO_FIRMWARE_VERSION=2

#### Use debug log level by default
CONFIG_MCUBOOT_LOG_LEVEL_DBG=y

## mbedTLS has its own heap
# CONFIG_HEAP_MEM_POOL_SIZE is not set

## Various Zephyr boards enable features that we don't want.
# CONFIG_BT is not set
# CONFIG_I2C is not set

CONFIG_FLASH=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y # former CONFIG_MODE_MINIMAL
CONFIG_LOG_DEFAULT_LEVEL=0
### Ensure Zephyr logging changes don't use more resources
### Use info log level by default
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
### Decrease footprint by ~4 KB in comparison to CBPRINTF_COMPLETE=y
CONFIG_CBPRINTF_NANO=y
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=0

### Enable fault injection hardening
CONFIG_BOOT_FIH_PROFILE_MEDIUM=y

# Do NOT validate the primary slot signature on every boot.
#
# With CONFIG_BOOT_VALIDATE_SLOT0=y (the default), MCUBoot performs a full
# signature check on the app primary slot at every boot. This creates a brick
# window during signing key rotation: a new MCUBoot built with K2 would refuse
# to boot the existing K1-signed app, even though it was installed legitimately.
#
# With this option disabled, MCUBoot only checks IMAGE_MAGIC at boot (basic
# sanity). Full signature validation still runs unconditionally before any
# upgrade is copied from the secondary slot to the primary slot — so the chain
# of trust for update integrity is fully preserved.
#
# The chain of trust is:
#   NSIB (immutable) → verifies MCUBoot signature at every boot
#   MCUBoot          → verifies app signature before every upgrade
#   MCUBoot          → checks IMAGE_MAGIC at boot (tamper sanity only)
#
# This is safe because the app primary slot is SPU-protected: only TF-M secure
# code or a physical JTAG attacker can write to it. Any app that passes the
# magic check was either factory-programmed or installed via a validated MCUBoot
# upgrade. Physical attackers are outside the firmware security boundary.
#
# Key rotation procedure (safe, no brick window):
#   1. Deploy new MCUBoot built with K2 (FW_INFO_FIRMWARE_VERSION incremented)
#      → devices reboot; MCUBoot self-updates; existing K1-signed app boots fine
#   2. Deploy K2-signed app at any time
#      → MCUBoot validates K2 signature on upgrade, installs it
#   No timing dependency between steps 1 and 2.
# CONFIG_BOOT_VALIDATE_SLOT0 is not set

# FPROTECT is set in NSIB instead
CONFIG_FPROTECT=n

# Core should be on a clean state when TF-M starts
CONFIG_MCUBOOT_CLEANUP_ARM_CORE=y
CONFIG_MCUBOOT_CLEANUP_RAM=y